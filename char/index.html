<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>배역 고르기 · acttub</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css">
    <!-- GA4. 프로덕션 호스트에서만 로드한다 — 로컬·프리뷰 유입은 집계하지 않는다. -->
    <script>
    (function(){
      if(!/(^|\.)acttub\.com$/.test(location.hostname))return;
      var ID='G-DRMEWBN9Y9';
      var s=document.createElement('script');
      s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+ID;
      document.head.appendChild(s);
      window.dataLayer=window.dataLayer||[];
      window.gtag=function(){window.dataLayer.push(arguments);};
      window.gtag('js',new Date());
      window.gtag('consent','default',{analytics_storage:'denied'});
      window.gtag('config',ID);
    })();
    </script>
    <style>
      .char-shell {
        padding-bottom: 0;
      }

      .role-picker {
        position: relative;
      }

      .role-picker-input {
        appearance: none;
        -webkit-appearance: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        background: transparent;
        opacity: 0;
        cursor: pointer;
      }

      .role-picker:has(.role-picker-input:focus-visible) {
        outline: 2px solid var(--color-primary);
        outline-offset: var(--spacing-xs);
      }

      .radio-tap-target {
        min-height: 44px;
      }

      /* device-matrix.py는 input[type=radio] 자체의 크기도 잰다 — 라벨을 44px로 키워도
         라디오 자체가 작으면(기본 h-5 w-5=20px) 계속 잡힌다. appearance:none으로 44px
         원을 직접 그리고, 안에 작은 점만 accent-primary 대신 ::before로 칠한다. */
      .radio-input {
        appearance: none;
        -webkit-appearance: none;
        width: 44px;
        height: 44px;
        margin: 0;
        border-radius: 50%;
        border: 2px solid var(--color-line);
        display: grid;
        place-content: center;
        cursor: pointer;
      }

      .radio-input::before {
        content: "";
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--color-primary);
        transform: scale(0);
        transition: transform 0.1s ease;
      }

      .radio-input:checked {
        border-color: var(--color-primary);
      }

      .radio-input:checked::before {
        transform: scale(1);
      }

      .include-input {
        appearance: none;
        -webkit-appearance: none;
        box-sizing: border-box;
        width: calc(var(--spacing-xl) + var(--spacing-sm));
        height: calc(var(--spacing-xl) + var(--spacing-xs));
        margin: 0;
        padding: var(--spacing-xs);
        border-radius: var(--radius-pill);
        background: var(--color-line);
        display: flex;
        align-items: center;
        justify-content: flex-start;
        cursor: pointer;
      }

      .include-input::before {
        content: "";
        width: calc(var(--spacing-xl) - var(--spacing-sm));
        height: calc(var(--spacing-xl) - var(--spacing-sm));
        border-radius: var(--radius-pill);
        background: var(--color-surface);
      }

      .include-input:checked {
        justify-content: flex-end;
        background: var(--color-primary);
      }

      .include-input:disabled {
        opacity: 1;
        cursor: not-allowed;
      }

      .include-input:focus-visible {
        outline: auto;
        outline-offset: var(--spacing-xs);
      }

      .range-control {
        --range-pct: 0%;
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        height: 44px;
        margin: 0;
        background: transparent;
      }

      .range-control::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          to right,
          var(--color-primary) var(--range-pct),
          var(--color-line) var(--range-pct)
        );
      }

      .range-control::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 28px;
        height: 28px;
        margin-top: -12px;
        border-radius: 50%;
        background: var(--color-primary);
        cursor: pointer;
      }

      .range-control::-moz-range-track {
        height: 4px;
        border-radius: 2px;
        background: var(--color-line);
      }

      .range-control::-moz-range-progress {
        height: 4px;
        border-radius: 2px;
        background: var(--color-primary);
      }

      .range-control::-moz-range-thumb {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: var(--color-primary);
        cursor: pointer;
      }
    </style>
  </head>
  <body class="m-0 bg-neutral font-sans text-ink">
    <div class="tier-root bg-neutral">
      <div class="char-shell tier-shell flex min-h-[var(--app-min-h)] flex-col pt-md">
        <header>
          <div class="flex items-center justify-between gap-md">
            <button id="backButton" type="button" class="bg-transparent p-0 text-[14px] font-medium text-ink-sub">← 대본 다시 붙여넣기</button>
            <p class="m-0 shrink-0 text-[13px] font-medium tabular-nums text-ink-sub">2 / 3</p>
          </div>
          <h1 class="m-0 text-h1">어느 배역이세요?</h1>
          <p id="readingDescription" class="mb-0 mt-sm text-body-lg text-ink-sub">
            고른 배역은 읽지 않고 기다릴게요.<br>
            나머지 배역을 소리로 읽어드려요.
          </p>
        </header>

        <main id="rolesList" class="mt-lg flex-1">
          <div id="includedRolesList" class="grid grid-cols-2 gap-sm"></div>

          <section id="excludedRolesSection" class="mt-sm hidden">
            <button id="excludedRolesToggle" type="button" class="flex min-h-11 w-full items-center justify-between gap-md rounded-lg bg-transparent px-md text-left text-ink-sub" aria-expanded="false" aria-controls="excludedRolesPanel">
              <span id="excludedRolesSummary" class="min-w-0 text-[13px] font-medium"></span>
              <span class="flex shrink-0 items-center gap-xs text-[13px] font-medium">
                <span id="excludedRolesAction">펼치기</span>
                <svg id="excludedRolesChevron" class="size-md" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
            </button>
            <div id="excludedRolesPanel" class="mt-sm hidden rounded-lg bg-surface-sub px-md">
              <p class="m-0 py-sm text-right text-[12px] font-semibold text-ink-sub">읽기에 포함</p>
              <div id="excludedRolesList"></div>
            </div>
          </section>

          <p id="roleIncludeError" class="mb-0 mt-md text-[13px] font-medium text-danger empty:hidden" aria-live="polite"></p>

          <fieldset class="mt-xl grid grid-cols-2 gap-sm border-0 p-0" aria-label="읽어주기 / 암기 테스트">
            <label class="radio-tap-target flex cursor-pointer items-center gap-sm rounded-lg bg-surface px-sm shadow-card">
              <input type="radio" name="practiceMode" value="read" class="radio-input shrink-0" checked>
              <strong class="text-[15px] font-semibold text-ink">읽어주기</strong>
            </label>
            <label class="radio-tap-target flex cursor-pointer items-center gap-sm rounded-lg bg-surface px-sm shadow-card">
              <input type="radio" name="practiceMode" value="quiz" class="radio-input shrink-0">
              <strong class="text-[15px] font-semibold text-ink">암기 테스트</strong>
            </label>
          </fieldset>

          <div id="readingSettings" class="mt-xl rounded-lg bg-surface shadow-card">
            <section>
              <button id="voiceSettingsToggle" type="button" class="flex min-h-xxl w-full items-center gap-md rounded-lg bg-transparent px-5 py-md text-left" aria-expanded="false" aria-controls="voiceSettingsPanel">
                <span class="min-w-0 flex-1">
                  <span class="block text-[16px] font-semibold text-ink">읽어주는 목소리</span>
                  <span id="voiceSettingsSummary" class="mt-xs block text-[13px] font-medium text-ink-tertiary">기기 음성 · 읽기에 포함 0명</span>
                </span>
                <svg id="voiceSettingsChevron" class="size-md shrink-0 text-ink-tertiary" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </button>
              <div id="voiceSettingsPanel" class="hidden px-5 pb-5">
                <div class="space-y-sm">
                  <label class="radio-tap-target flex cursor-pointer items-center gap-sm rounded-md">
                    <input type="radio" name="engine" value="device" class="radio-input shrink-0" checked>
                    <span>
                      <strong class="block text-[15px] font-semibold text-ink">기기 음성</strong>
                      <span class="block text-[13px] font-medium text-ink-tertiary">이 기기의 한국어 음성으로 읽어요</span>
                    </span>
                  </label>

                  <label class="radio-tap-target flex cursor-pointer items-center gap-sm rounded-md">
                    <input type="radio" name="engine" value="cloud" class="radio-input shrink-0">
                    <span>
                      <strong class="block text-[15px] font-semibold text-ink">자연스러운 음성</strong>
                      <span class="block text-[13px] font-medium text-ink-tertiary">상대 배역 모두를 한 목소리로 읽어요</span>
                    </span>
                  </label>

                  <div id="cloudVoiceOptions" class="ml-xl hidden rounded-lg bg-surface-sub p-md">
                    <p id="cloudVoiceCaption" class="m-0 text-[13px] font-medium text-ink-sub">목소리</p>
                    <select id="cloudVoiceId" class="mt-sm min-h-11 w-full rounded-md border-0 bg-neutral px-md text-[16px] text-ink" aria-labelledby="cloudVoiceCaption">
                      <option value="cgSgspJ2msm6clMCkdW9">지수 (여·차분)</option>
                      <option value="EXAVITQu4vr4xnSDxMaL">서현 (여·또렷)</option>
                      <option value="bIHbv24MWmeRgasZH58o">도윤 (남·또래)</option>
                      <option value="cjVigY5qzO86Huf0OWal">우진 (남·낮은)</option>
                      <option value="iP95p4xoKVk53GoZ742B">태호 (남·편안)</option>
                      <option value="SAz9YHcvj6GT2YYXdXww" selected>하람 (중성)</option>
                    </select>
                    <p class="mb-0 mt-sm text-[12px] font-medium text-ink-sub">
                      읽어주려면 상대 배역 대사가 음성 서비스로 전달돼요. 대본이 기기 밖으로 나가지 않길 원하면 기기 음성을 쓰세요.
                    </p>
                  </div>
                </div>

                <p id="voiceOverlapNote" class="mb-0 mt-md hidden text-[13px] font-medium text-ink-sub" aria-live="polite"></p>
                <!-- 이 기기에 기기 안에서 도는(localService) 한국어 음성이 하나도 없을 때만 -->
                <p id="remoteVoiceNotice" class="mb-0 mt-sm hidden text-[13px] font-medium text-ink-sub" aria-live="polite">
                  이 기기에는 기기 안에서 도는 한국어 음성이 없어서, 읽어주는 동안 대사가 브라우저 음성 서비스로 전달돼요.
                </p>

                <div id="roleSettingsList" class="mt-md border-t border-line"></div>
              </div>
            </section>

            <section class="border-t border-line">
              <button id="advanceSettingsToggle" type="button" class="flex min-h-xxl w-full items-center gap-md rounded-lg bg-transparent px-5 py-md text-left" aria-expanded="false" aria-controls="advanceSettingsPanel">
                <span class="min-w-0 flex-1">
                  <span class="block text-[16px] font-semibold text-ink">내 차례 넘기는 방식</span>
                  <span id="advanceSettingsSummary" class="mt-xs block text-[13px] font-medium text-ink-tertiary">침묵 감지 · 1.2초</span>
                </span>
                <svg id="advanceSettingsChevron" class="size-md shrink-0 text-ink-tertiary" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </button>
              <div id="advanceSettingsPanel" class="hidden px-5 pb-5">
                <div class="space-y-sm">
                  <!-- 침묵 감지가 기본값이다 — 음량만 보고 음성 인식을 안 쓰므로 목소리가
                       기기 밖으로 안 나간다. 큐 단어는 구조적으로 브라우저 벤더 서버로
                       목소리를 보내야만 동작해서(막을 방법이 없다) 기본값으로 두지 않는다. -->
                  <label class="radio-tap-target flex cursor-pointer items-center gap-sm rounded-md">
                    <input type="radio" name="advanceMode" value="tap" class="radio-input shrink-0">
                    <span>
                      <strong class="block text-[15px] font-semibold text-ink">탭</strong>
                      <span class="block text-[13px] font-medium text-ink-tertiary">화면을 누르면 다음으로</span>
                    </span>
                  </label>

                  <label class="radio-tap-target flex cursor-pointer items-center gap-sm rounded-md">
                    <input type="radio" name="advanceMode" value="silence" class="radio-input shrink-0" checked>
                    <span>
                      <strong class="block text-[15px] font-semibold text-ink">침묵 감지</strong>
                      <span class="block text-[13px] font-medium text-ink-tertiary">말이 끝난 뒤 조용한 시간을 감지해요</span>
                    </span>
                  </label>

                  <div id="silenceOptions" class="ml-xl rounded-lg bg-surface-sub p-md">
                    <!-- <label for>이 아니라 <p>다 — 이 캡션은 range를 감싸지 않아서 44px로 자라지
                         않는다(device-matrix.py는 label을 전부 탭 타겟으로 본다). 접근성 이름은
                         aria-labelledby로 연결한다. -->
                    <p id="silenceSecCaption" class="m-0 flex items-center justify-between text-[13px] font-medium text-ink-sub">
                      <span>조용한 시간</span>
                      <span id="silenceSecLabel" class="font-semibold text-primary">1.2초</span>
                    </p>
                    <input id="silenceSec" class="range-control" type="range" min="0.3" max="3.0" step="0.1" value="1.2" aria-labelledby="silenceSecCaption">
                  </div>

                  <label class="radio-tap-target flex cursor-pointer items-center gap-sm rounded-md">
                    <input type="radio" name="advanceMode" value="cue" class="radio-input shrink-0">
                    <span>
                      <strong class="block text-[15px] font-semibold text-ink">큐 단어</strong>
                      <span class="block text-[13px] font-medium text-ink-tertiary">내 대사의 마지막 어절이 들리면 다음으로</span>
                    </span>
                  </label>

                  <p id="cueNotice" class="mb-0 ml-xl mt-sm hidden text-[12px] font-medium text-ink-sub" aria-live="polite">
                    이 방식은 말소리를 브라우저 음성 인식 서비스로 보내요. 대본이 밖으로 나가지 않길 원하면 침묵 감지를 쓰세요.
                  </p>
                </div>
              </div>
            </section>
          </div>

          <p class="mb-0 mt-xl text-center text-[13px] font-medium text-ink-sub">
            <a class="inline-flex min-h-11 items-center rounded-sm px-sm underline" href="/privacy">대본은 어디로 가나요</a>
          </p>
        </main>

        <footer class="tier-sticky-bottom mt-auto">
          <button id="startButton" type="button" class="h-14 w-full rounded-lg bg-primary-strong font-bold text-white active:bg-primary-deep disabled:cursor-not-allowed disabled:bg-line disabled:text-ink-tertiary">연습 시작</button>
        </footer>
      </div>
    </div>
    <script type="module" src="/app/char.js"></script>
  </body>
</html>
