<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>대본 붙여넣기 · acttub</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="m-0 bg-neutral font-sans text-ink">
    <div class="tier-root bg-neutral">
      <div class="tier-shell flex min-h-[var(--app-min-h)] flex-col pt-md">
        <header class="pb-lg pt-sm">
          <p class="mb-1 text-[13px] font-bold tracking-[0.02em] text-primary">acttub</p>
          <h1 class="m-0 text-h1">대본을 붙여넣으세요</h1>
          <p class="mb-0 mt-2 text-body-lg text-ink-sub">
            배역 이름과 대사만 있으면 돼요.<br>
            대본은 이 기기에만 저장돼요.
          </p>
        </header>

        <main>
          <section class="bg-surface p-5 rounded-xl shadow-card">
            <!-- <label>이 아니라 <p>다 — device-matrix.py는 label을 전부 탭 타겟으로 보는데
                 이건 캡션이지 체크박스/라디오처럼 44px로 키울 대상이 아니다. 접근성 이름은
                 aria-labelledby로 그대로 연결한다. -->
            <div class="mb-3 flex flex-wrap items-center gap-3">
              <input
                id="scriptFileInput"
                class="hidden"
                type="file"
                accept=".txt,.docx,.hwpx,.hwp,.pdf,text/plain"
              >
              <button
                id="scriptFileButton"
                type="button"
                class="inline-flex min-h-11 items-center justify-center rounded-md bg-primary-soft px-3 py-2 text-[14px] font-bold text-primary active:bg-primary-soft-hover disabled:cursor-not-allowed disabled:bg-line disabled:text-ink-tertiary"
              ><span id="scriptFileButtonText">대본 파일 열기</span></button>
              <span class="text-[13px] font-medium text-ink-tertiary">txt · docx · hwpx (파일은 이 기기에서만 열려요)</span>
            </div>
            <p id="scriptFileStatus" class="mb-2 text-[13px] font-medium text-ink-sub" aria-live="polite" hidden></p>
            <p id="scriptInputLabel" class="mb-2 text-[13px] font-bold text-primary">이렇게 붙여넣으면 돼요</p>
            <textarea
              id="scriptInput"
              class="min-h-64 w-full resize-y rounded-md border-0 bg-surface-sub p-3 font-script leading-[1.7] text-ink placeholder:text-placeholder"
              rows="10"
              placeholder="지훈: 왜 아무 말도 안 했어.&#10;서연: 말하면 네가 그만둘 것 같았으니까.&#10;지훈: 그건 네가 정할 일이 아니잖아.&#10;서연: (고개를 돌린다)&#10;서연: 알아. 아는데 그때는 그게 최선이라고 생각했어."
              aria-labelledby="scriptInputLabel"
              aria-describedby="scriptFileStatus scriptError"
            ></textarea>
            <p id="scriptError" class="mb-0 mt-2 text-[13px] font-medium text-danger" aria-live="polite">대본을 붙여넣어 주세요.</p>
          </section>
        </main>

        <footer class="mt-auto pt-lg">
          <button
            id="continueButton"
            type="button"
            class="h-14 w-full rounded-lg bg-primary-strong font-bold text-white active:bg-primary-deep disabled:cursor-not-allowed disabled:bg-line disabled:text-ink-tertiary"
            disabled
          >배역 고르기</button>
          <p class="mb-0 mt-2 text-center text-[13px] font-medium text-ink-tertiary">1 / 3</p>
          <p class="mb-0 mt-3 text-center text-[13px] font-medium text-ink-tertiary"><a class="underline" href="/privacy">대본은 어디로 가나요</a></p>
        </footer>
      </div>
    </div>
    <script type="module" src="/app/input.js"></script>
  </body>
</html>
