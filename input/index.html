<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>대본 붙여넣기 · acttub</title>
    <!-- `/`에서 넘어온 주소가 그대로 공유될 수 있다. 공유 카드는 `/`와 같은 것을 쓴다. -->
    <meta name="description" content="대본을 붙여넣고 내 배역을 고르면, 나머지 배역의 대사를 소리로 읽어줍니다. 상대 없이 혼자 리딩하는 도구예요. 대본은 이 기기에만 저장돼요.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://read.acttub.com/">
    <meta property="og:title" content="혼자 하는 대본 리딩">
    <meta property="og:description" content="대본을 붙여넣고 내 배역만 고르면, 나머지는 소리로 읽어줘요.">
    <meta property="og:image" content="https://read.acttub.com/og.jpg">
    <meta property="og:site_name" content="acttub">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css">
    <!-- GA4. 프로덕션 호스트에서만 로드한다 — 로컬·프리뷰 유입은 집계하지 않는다. -->
    <script>
    (function(){
      if(!/(^|\.)acttub\.com$/.test(location.hostname))return;
      var ID='G-DRMEWBN9Y9';
      var s=document.createElement('script');
      s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+ID;
      document.head.appendChild(s);
      window.dataLayer=window.dataLayer||[];
      window.gtag=function(){window.dataLayer.push(arguments);};
      window.gtag('js',new Date());
      window.gtag('consent','default',{analytics_storage:'denied'});
      window.gtag('config',ID);
    })();
    </script>
  </head>
  <body class="m-0 bg-neutral font-sans text-ink">
    <div class="tier-root bg-neutral">
      <div class="tier-shell flex min-h-[var(--app-min-h)] flex-col pt-md">
        <header class="pb-lg pt-sm desktop:pb-xl">
          <p class="mb-1 text-label tracking-[0.02em] text-ink-sub">acttub</p>
          <h1 id="pageTitle" class="m-0 text-h1">대본을 넣어주세요</h1>
          <p class="mb-0 mt-2 text-body-lg text-ink-sub">배역 이름과 대사만 있으면 돼요.</p>
        </header>

        <main class="flex flex-1 flex-col">
          <input
            id="scriptFileInput"
            class="hidden"
            type="file"
            accept=".txt,.docx,.hwpx,.hwp,.pdf,text/plain"
          >

          <section id="emptyState" class="grid gap-sm" aria-labelledby="pageTitle">
            <button
              id="pasteButton"
              type="button"
              class="flex min-h-[72px] w-full flex-col items-start justify-center rounded-lg bg-surface px-md py-sm text-left shadow-card active:bg-primary-soft"
            >
              <span class="text-subtitle text-primary-strong">붙여넣기</span>
              <span class="mt-xs text-body-sm text-ink-sub">복사해둔 대본을 바로 넣어요</span>
            </button>
            <button
              id="scriptFileButton"
              type="button"
              class="flex min-h-[72px] w-full flex-col items-start justify-center rounded-lg bg-surface px-md py-sm text-left shadow-card active:bg-primary-soft disabled:cursor-not-allowed disabled:bg-line disabled:text-ink-tertiary"
            >
              <span id="scriptFileButtonText" class="text-subtitle text-primary-strong">파일에서 열기</span>
              <span class="mt-xs text-body-sm text-ink-sub">txt · docx · hwpx</span>
            </button>
            <button
              id="writeButton"
              type="button"
              class="flex min-h-[72px] w-full items-center rounded-lg bg-surface px-md py-sm text-left text-subtitle text-primary-strong shadow-card active:bg-primary-soft"
            >직접 쓰기</button>

            <div class="mt-xl">
              <p class="mb-sm mt-0 text-body-sm font-semibold text-ink-sub">이런 모양이면 돼요</p>
              <div class="font-script text-[15px] leading-[1.9] text-ink-tertiary">
                <p class="m-0">니나: 왜 그렇게 화가 났어요?</p>
                <p class="m-0">꼬스챠: 난 화난 게 아니에요.</p>
                <p class="m-0">니나: (돌아서며) 그럼 왜 그래요?</p>
              </div>
              <p class="mb-0 mt-sm text-body-sm text-ink-tertiary">이름 뒤에 <b>:</b> 이나 탭이 있으면 돼요. 괄호 안은 지문으로 봐요.</p>
            </div>
          </section>

          <section id="inputState" aria-labelledby="pageTitle" hidden>
            <button
              id="resetButton"
              type="button"
              class="mb-sm inline-flex min-h-11 items-center gap-xs bg-transparent px-xs text-body-sm font-semibold text-ink-sub"
            >
              <span aria-hidden="true">←</span>
              <span>다시 넣기</span>
            </button>
            <p id="pasteGuidance" class="mb-sm mt-0 text-body-sm font-medium text-ink-sub" aria-live="polite" hidden></p>
            <textarea
              id="scriptInput"
              class="max-h-[42svh] w-full resize-none overflow-y-auto rounded-lg border-0 bg-surface p-md font-script text-[16px] leading-[1.7] text-ink shadow-card placeholder:text-placeholder focus:outline-[1.5px] focus:outline-primary focus:outline-offset-2 tablet:max-h-[28rem]"
              rows="6"
              placeholder="지훈: 왜 아무 말도 안 했어.&#10;서연: 말하면 네가 그만둘 것 같았으니까.&#10;지훈: 그건 네가 정할 일이 아니잖아.&#10;서연: (고개를 돌린다)&#10;서연: 알아. 아는데 그때는 그게 최선이라고 생각했어."
              aria-labelledby="pageTitle"
              aria-describedby="pasteGuidance scriptFileStatus scriptError"
            ></textarea>
            <div id="roleChips" class="mt-md flex flex-wrap gap-xs" aria-live="polite" hidden></div>
            <div id="manualRolesField" class="mt-md" hidden>
              <label for="manualRolesInput" class="mb-xs flex min-h-11 items-center text-[14px] font-semibold text-ink-sub">배역 이름을 쉼표로 알려주세요</label>
              <input
                id="manualRolesInput"
                class="min-h-11 w-full rounded-lg border-0 bg-surface px-md text-ink shadow-card focus:outline-[1.5px] focus:outline-primary focus:outline-offset-2"
                type="text"
                autocomplete="off"
                aria-describedby="scriptError"
              >
            </div>
            <p id="scriptError" class="mb-0 mt-sm text-body-sm font-medium text-danger" aria-live="polite"></p>
          </section>

          <p id="scriptFileStatus" class="mb-0 mt-sm text-body-sm font-medium text-ink-sub" aria-live="polite" hidden></p>
        </main>

        <footer class="pt-lg">
          <button
            id="continueButton"
            type="button"
            class="wide-action h-14 w-full rounded-lg bg-primary-strong font-bold text-white active:bg-primary-deep disabled:cursor-not-allowed disabled:bg-line disabled:text-ink-tertiary"
            hidden
            disabled
          >배역 고르기</button>
          <p class="mb-0 mt-sm text-body-sm font-medium text-ink-sub">대본은 이 기기에만 저장돼요.</p>
          <div class="mt-2 flex items-center justify-between gap-4">
            <p class="m-0 text-[13px] font-medium text-ink-tertiary">1 / 3</p>
            <p class="m-0 text-[13px] font-medium text-ink-tertiary"><a class="underline" href="/privacy">대본은 어디로 가나요</a></p>
          </div>
        </footer>
      </div>
    </div>
    <script type="module" src="/app/input.js"></script>
  </body>
</html>
