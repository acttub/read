<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>대본 붙여넣기 · acttub</title>
    <!-- `/`에서 넘어온 주소가 그대로 공유될 수 있다. 공유 카드는 `/`와 같은 것을 쓴다. -->
    <meta name="description" content="대본을 붙여넣고 내 배역을 고르면, 나머지 배역의 대사를 소리로 읽어줍니다. 상대 없이 혼자 리딩하는 도구예요. 대본은 이 기기에만 저장돼요.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://read.acttub.com/">
    <meta property="og:title" content="혼자 하는 대본 리딩">
    <meta property="og:description" content="대본을 붙여넣고 내 배역만 고르면, 나머지는 소리로 읽어줘요.">
    <meta property="og:image" content="https://read.acttub.com/og.jpg">
    <meta property="og:site_name" content="acttub">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <!-- GA4. 프로덕션 호스트에서만 로드한다 — 로컬·프리뷰 유입은 집계하지 않는다. -->
    <script>
    (function(){
      if(!/(^|\.)acttub\.com$/.test(location.hostname))return;
      var ID='G-DRMEWBN9Y9';
      var s=document.createElement('script');
      s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+ID;
      document.head.appendChild(s);
      window.dataLayer=window.dataLayer||[];
      window.gtag=function(){window.dataLayer.push(arguments);};
      window.gtag('js',new Date());
      window.gtag('consent','default',{analytics_storage:'denied'});
      window.gtag('config',ID);
    })();
    </script>
  </head>
  <body class="script-page m-0 bg-canvas font-sans text-ink">
    <header class="desktop-header" data-tier-only="desktop">
      <div class="desktop-header-inner">
        <a class="brand-lockup" href="/" aria-label="acttub read 홈"><span class="brand-mark" aria-hidden="true"></span><span>acttub read</span></a>
        <nav class="desktop-nav" aria-label="주요 단계">
          <a href="/">홈</a><a class="is-active" href="/input" aria-current="page">대본</a><a href="/char">리딩</a><a href="/quiz#completionState">요약</a>
        </nav>
        <div class="desktop-actions"><a class="button-secondary" href="/input">새 대본</a><a class="button-primary" href="/char">바로 리딩</a></div>
      </div>
    </header>

    <div class="tier-root app-page">
      <div class="tier-shell script-shell">
        <a class="brand-lockup mobile-brand" href="/" aria-label="acttub read 홈"><span class="brand-mark" aria-hidden="true"></span><span>acttub read</span></a>
        <header class="page-intro">
          <div>
            <h1 id="pageTitle">대본과 배역</h1>
            <p>대사를 넣고 내가 읽을 배역을 선택하세요.</p>
          </div>
          <ol class="step-rail" aria-label="리딩 준비 단계">
            <li class="is-current">대본 넣기</li><li>배역 정하기</li><li>바로 리딩</li>
          </ol>
        </header>

        <main class="script-workspace">
          <input id="scriptFileInput" class="hidden" type="file" accept=".txt,.docx,.hwpx,.hwp,.pdf,text/plain">

          <section class="workspace-card input-card" aria-labelledby="inputCardTitle">
            <div class="card-heading">
              <div><h2 id="inputCardTitle">대본 넣기</h2><p>파일을 열거나 복사한 대본을 붙여넣으세요.</p></div>
            </div>

            <div id="emptyState" class="input-methods" aria-labelledby="pageTitle">
              <button id="scriptFileButton" type="button" class="drop-action" aria-describedby="scriptFileFormats">
                <span class="upload-icon" aria-hidden="true">↑</span>
                <strong id="scriptFileButtonText">파일에서 열기</strong>
                <span id="scriptFileFormats">txt · docx · hwpx · pdf</span>
              </button>
              <button id="pasteButton" type="button" class="method-action"><strong>붙여넣기</strong><span>복사해둔 대본을 바로 넣어요</span></button>
              <button id="writeButton" type="button" class="method-action"><strong>직접 쓰기</strong><span>빈 칸에서 대본을 입력해요</span></button>
              <button id="sampleScriptButton" type="button" class="method-action"><strong>예시 대본 불러오기</strong><span>두 배역의 대사를 바로 펼쳐봐요</span></button>
            </div>

            <section id="inputState" aria-labelledby="pageTitle" hidden>
              <div class="input-toolbar">
                <span class="text-body-sm font-semibold text-ink-sub">파싱 미리보기</span>
                <button id="resetButton" type="button" class="button-text">다시 넣기</button>
              </div>
              <p id="pasteGuidance" class="mb-sm mt-0 text-body-sm font-medium text-ink-sub" aria-live="polite" hidden></p>
              <textarea
                id="scriptInput"
                class="script-textarea"
                rows="10"
                placeholder="배역 이름 뒤에 : 또는 탭을 넣고 대사를 적어주세요."
                aria-labelledby="pageTitle"
                aria-describedby="pasteGuidance scriptFileStatus scriptError"
              ></textarea>
            </section>
            <p id="scriptFileStatus" class="mb-0 mt-sm text-body-sm font-medium text-ink-sub" aria-live="polite" hidden></p>
          </section>

          <aside class="workspace-card role-card" aria-labelledby="roleCardTitle">
            <div class="card-heading">
              <div><h2 id="roleCardTitle">배역 정하기</h2><p>찾은 배역을 확인한 뒤 다음 단계에서 내 배역을 고릅니다.</p></div>
            </div>
            <div id="roleChips" class="role-preview-list" aria-live="polite" hidden></div>
            <div class="role-empty-copy"><span class="role-empty-icon" aria-hidden="true">◎</span><p>대본을 넣으면 배역과 대사 수가 여기에 나타나요.</p></div>
            <div id="manualRolesField" class="manual-role-field" hidden>
              <label for="manualRolesInput">배역 이름을 쉼표로 알려주세요</label>
              <input id="manualRolesInput" type="text" autocomplete="off" aria-describedby="scriptError">
            </div>
            <p id="scriptError" class="mb-0 mt-sm text-body-sm font-medium text-danger" aria-live="polite"></p>
            <button id="continueButton" type="button" class="button-primary button-large mt-auto w-full" hidden disabled>배역 고르기</button>
          </aside>
        </main>

        <footer class="privacy-footnote">
          <p>대본은 이 기기에만 저장돼요.</p>
          <a href="/privacy">대본은 어디로 가나요</a>
        </footer>
      </div>
    </div>

    <nav class="mobile-tabs" aria-label="주요 단계" data-tier-only="phone">
      <a href="/"><span class="tab-icon">⌂</span><span>홈</span></a>
      <a class="is-active" href="/input" aria-current="page"><span class="tab-icon">▤</span><span>대본</span></a>
      <a href="/char"><span class="tab-icon">▷</span><span>리딩</span></a>
      <a href="/quiz#completionState"><span class="tab-icon">▥</span><span>요약</span></a>
    </nav>
    <script type="module" src="/app/input.js"></script>
  </body>
</html>
