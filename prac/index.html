<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>대본 리딩 · acttub</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css">
    <!-- GA4. 프로덕션 호스트에서만 로드한다 — 로컬·프리뷰 유입은 집계하지 않는다. -->
    <script>
    (function(){
      if(!/(^|\.)acttub\.com$/.test(location.hostname))return;
      var ID='G-DRMEWBN9Y9';
      var s=document.createElement('script');
      s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+ID;
      document.head.appendChild(s);
      window.dataLayer=window.dataLayer||[];
      window.gtag=function(){window.dataLayer.push(arguments);};
      window.gtag('js',new Date());
      window.gtag('consent','default',{analytics_storage:'denied'});
      window.gtag('config',ID);
    })();
    </script>
  </head>
  <body class="reading-page m-0 bg-session font-sans text-white">
    <header class="desktop-header summary-header" data-tier-only="desktop">
      <div class="desktop-header-inner">
        <a class="brand-lockup" href="/" aria-label="acttub read 홈"><span class="brand-mark" aria-hidden="true"></span><span>acttub read</span></a>
        <nav class="desktop-nav" aria-label="주요 단계"><a href="/">홈</a><a href="/input">대본</a><a href="/char">리딩</a><a class="is-active" href="#completionMessage">요약</a></nav>
        <div class="desktop-actions"><a class="button-secondary" href="/input">새 대본</a><a class="button-primary" href="/char">다시 리딩</a></div>
      </div>
    </header>

    <div id="readingSurface" class="tier-root session-page">
      <div class="tier-shell reading-shell">
        <header class="session-header">
          <div>
            <button id="exitButton" type="button" class="session-exit">✕ 나가기</button>
            <h1 id="sessionTitle">리딩 중</h1>
          </div>
          <div class="session-header-status">
            <span><strong id="mobileRemaining">—</strong><small>남은 대사</small></span>
            <span><strong id="mobileElapsed" class="time-value">00:00</strong><small>경과 시간</small></span>
          </div>
        </header>

        <main id="readingStage" class="session-layout">
          <section class="session-document" aria-label="진행 중인 대본">
            <div id="readingPastTurns" class="reading-past-turns" aria-hidden="true"></div>
            <section id="currentLineCard" class="reading-current-turn bg-surface">
              <p id="currentRoleName"></p>
              <p id="currentLineText" class="font-script"></p>
            </section>
            <div id="readingNextTurn" class="reading-next-turn" aria-hidden="true"></div>
          </section>

          <aside class="session-status-panel" aria-label="세션 상태" data-tier-only="desktop">
            <h2>세션 상태</h2>
            <div class="status-card"><strong id="progressText">—</strong><span>남은 대사</span></div>
            <div class="status-card"><strong id="elapsedTime" class="time-value">00:00</strong><span>경과 시간</span></div>
          </aside>

          <div class="session-feedback">
            <span id="statusPill" class="sr-only" aria-live="polite">누르면 시작해요</span>
            <p id="modeError" aria-live="polite"></p>
          </div>
        </main>

        <section id="completionMessage" class="completion-panel hidden">
          <div class="completion-heading">
            <div><p class="summary-eyebrow">요약</p><h1>리딩이 완료되었습니다</h1><p>대본의 마지막 줄까지 이어갔어요.</p></div>
            <a class="button-primary button-large" href="/char">다시 리딩</a>
          </div>
          <article class="completion-core-card">
            <p>상대 대사는 기계가 읽었어. 근데 네 대사에 무슨 생각을 담을지는 네가 정한 거야 —</p>
            <a href="https://acttub.com">acttub에서 질문으로 →</a>
          </article>
        </section>

        <footer class="session-controls">
          <div class="session-control-buttons">
            <button id="pauseButton" type="button" class="session-control-primary">시작</button>
            <button id="nextButton" type="button" class="session-control-secondary" disabled>다음</button>
            <a class="session-control-link" href="/char" aria-label="리딩 설정">⚙</a>
          </div>
          <p id="modeHint">시작을 누르면 읽어드릴게요</p>
        </footer>
      </div>
    </div>

    <nav class="mobile-tabs session-tabs" aria-label="주요 단계" data-tier-only="phone">
      <a href="/"><span class="tab-icon">⌂</span><span>홈</span></a>
      <a href="/input"><span class="tab-icon">▤</span><span>대본</span></a>
      <a class="is-active reading-tab" href="#readingStage" aria-current="page"><span class="tab-icon">▷</span><span>리딩</span></a>
      <a class="summary-tab" href="#completionMessage"><span class="tab-icon">▥</span><span>요약</span></a>
    </nav>
    <script type="module" src="/app/prac.js"></script>
  </body>
</html>
