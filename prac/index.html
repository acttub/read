<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>대본 리딩 · acttub</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css">
    <!-- GA4. 프로덕션 호스트에서만 로드한다 — 로컬·프리뷰 유입은 집계하지 않는다. -->
    <script>
    (function(){
      if(!/(^|\.)acttub\.com$/.test(location.hostname))return;
      var ID='G-DRMEWBN9Y9';
      var s=document.createElement('script');
      s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+ID;
      document.head.appendChild(s);
      window.dataLayer=window.dataLayer||[];
      window.gtag=function(){window.dataLayer.push(arguments);};
      window.gtag('js',new Date());
      window.gtag('consent','default',{analytics_storage:'denied'});
      window.gtag('config',ID);
    })();
    </script>
  </head>
  <body class="m-0 bg-neutral font-sans text-ink">
    <div id="readingSurface" class="tier-root bg-neutral">
      <div class="tier-shell flex min-h-[var(--app-min-h)] flex-col pt-md">
        <header class="grid min-h-11 grid-cols-[1fr_auto_1fr] items-center gap-sm">
          <button id="exitButton" type="button" class="inline-flex min-h-11 items-center gap-xs justify-self-start bg-transparent px-xs text-body-sm font-semibold text-ink-sub">
            <span aria-hidden="true">✕</span>
            <span>나가기</span>
          </button>
          <p id="progressText" class="m-0 justify-self-center text-body-sm font-semibold tabular-nums text-ink-sub">1 / 1</p>
          <div id="pauseSlot" class="justify-self-end"></div>
        </header>

        <div id="progressTrack" class="mt-sm h-xs overflow-hidden rounded-pill bg-line" role="progressbar" aria-label="대본 진행" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1">
          <span id="progressBarFill" class="block h-full rounded-pill bg-primary"></span>
        </div>

        <main class="flex min-h-0 flex-1 flex-col">
          <div id="lineStage" class="flex min-h-0 flex-1 flex-col gap-md pt-lg">
            <section id="previousTurn" class="px-xs" hidden>
              <p id="previousRoleName" class="m-0 text-label text-ink-sub"></p>
              <p id="previousLineText" class="mb-0 mt-xs line-clamp-2 font-script text-body-md text-ink-sub"></p>
            </section>

            <section id="currentLineCard" class="flex min-h-0 flex-col rounded-lg bg-surface p-5 shadow-card">
              <p id="currentRoleName" class="mb-sm mt-0 text-label text-primary-strong"></p>
              <p id="currentLineText" class="m-0 font-script text-[22px] font-semibold leading-[1.4] text-ink"></p>
            </section>

            <section id="nextTurn" class="px-xs" hidden>
              <p id="nextRoleName" class="m-0 text-label text-ink-sub"></p>
              <p id="nextLineText" class="mb-0 mt-xs line-clamp-2 font-script text-body-md text-ink-sub"></p>
            </section>

            <section id="completionMessage" class="hidden mt-auto flex-col rounded-lg bg-surface p-5 shadow-card">
              <p class="m-0 text-h2">대본을 다 읽었어요</p>
              <p class="mb-0 mt-md text-body-md text-ink-sub">
                상대 대사는 기계가 읽었어. 근데 네 대사에 무슨 생각을 담을지는 네가 정한 거야.
              </p>
            </section>

            <p id="modeError" class="m-0 text-body-sm font-medium text-danger" aria-live="polite"></p>
          </div>
        </main>

        <footer class="pt-lg">
          <div class="mb-md flex h-xl items-center">
            <span id="statusPill" class="inline-flex rounded-pill bg-primary-soft px-md py-[6px] text-label text-primary-strong" aria-live="polite" hidden></span>
          </div>
          <div id="actionSlot" class="grid">
            <button id="pauseButton" type="button" class="col-start-1 row-start-1 flex h-xxl w-full items-center justify-center rounded-md bg-primary-strong text-subtitle text-white hover:bg-primary-deep active:scale-[0.98] active:bg-primary-deep disabled:pointer-events-none disabled:opacity-40">시작</button>
            <button id="nextButton" type="button" class="col-start-1 row-start-1 flex h-xxl w-full items-center justify-center rounded-md bg-primary-soft text-subtitle text-primary-strong hover:bg-primary-soft-hover active:scale-[0.98] active:bg-primary-soft-hover disabled:pointer-events-none disabled:opacity-40" hidden disabled>다음</button>
            <a id="completionCta" href="https://acttub.com" class="btn col-start-1 row-start-1 hidden h-xxl w-full items-center justify-center rounded-md bg-primary-strong text-subtitle text-white hover:bg-primary-deep active:scale-[0.98] active:bg-primary-deep">acttub에서 질문으로 →</a>
          </div>
        </footer>
      </div>
    </div>
    <script type="module" src="/app/prac.js"></script>
  </body>
</html>
